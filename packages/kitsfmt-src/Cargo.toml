[package]
name = "kitsfmt"
version = "0.3.1"
edition = "2021"
description = "A Nix configuration formatter with AST-based sorting, merging, and comment preservation"

[[bin]]
name = "kitsfmt"
path = "src/main.rs"

[dependencies]
rnix = "0.14"
rowan = "0.16"

[profile.release]
lto = true
opt-level = "s"
