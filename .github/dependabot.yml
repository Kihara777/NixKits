# Dependabot —— 覆盖本仓库的「自动化表面」。
#
# 本仓库是 Nix flake，主要依赖由 flake.lock 管理（且刻意不提交），
# 因此 Dependabot 的价值集中在 GitHub Actions 上：workflow 里引用的
# action 一旦有安全更新，应能自动提出升级。
#
# 注意：本仓库把 action 固定在提交 SHA（见 .github/workflows/），
# Dependabot 会在保留 SHA 固定的前提下更新 SHA 并同步注释中的版本号。

version: 2
updates:
  # GitHub Actions —— 覆盖 .github/workflows/ 下所有 workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

# 为什么不监视 npm 生态
# ----------------------
# 本仓库的 npm 包（packages/dsh-nixos-shell）由 buildNpmPackage 包装，
# 其 npmDepsHash 会被主构建与 npm-deps 产物**逐字节**校验。Dependabot
# 只改 package.json/package-lock.json，无法感知 .nix 里的该 hash，因此
# 它开出的每个 npm 更新 PR **必然 CI 失败**（`npmDepsHash is out of
# date`）——属结构性错配，不是可修复的配置问题。实测见 2026-09-17 的
# PR #7（已关闭）。
#
# 另外 Dependabot 只在其配置的 semver 通道内推进，不会跨到 next/alpha
# 这类 dist-tag；而本仓库的插件依赖需要与宿主 dsh 的版本对齐，人工判断
# 更合适。
#
# npm 依赖的升级改由 `nix-flake-update-check` 技能人工处理（该技能已
# 涵盖补 npmDepsHash 与核对目标通道两步）。
