name: CI Summary

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build *"
    types:
      - completed

concurrency: ci-summary

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Generate CI status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          FAILED=""
          # Batch-fetch all workflow run conclusions in a single API call
          # List all workflow files whose name starts with "Build "
          workflows=$(gh api "repos/$REPO/actions/workflows" --jq '.workflows[] | select(.name | startswith("Build ")) | .name + ":" + .path')

          while IFS=':' read -r wf_name wf_path; do
            [ -z "$wf_path" ] && continue
            # Get latest run conclusion for this workflow
            conclusion=$(gh api "repos/$REPO/actions/workflows/$wf_path/runs?per_page=1" --jq '.workflow_runs[0].conclusion // "unknown"')
            if [ "$conclusion" = "failure" ]; then
              # Extract short name: Build codewhale (riscv64) → codewhale-riscv64
              short=$(echo "$wf_name" | sed 's/^Build //' | sed 's/ (/ /g' | sed 's/)//g' | tr ' ' '-')
              FAILED="$FAILED $short"
            fi
          done <<< "$workflows"

          FAILED=$(echo "$FAILED" | xargs)

          if [ -z "$FAILED" ]; then
            echo '{"schemaVersion":1,"label":"CI","message":"passing","color":"success"}' > ci-status.json
          else
            # Trim to fit badge width (max ~10 failed items)
            echo "{\"schemaVersion\":1,\"label\":\"CI\",\"message\":\"$FAILED\",\"color\":\"critical\"}" > ci-status.json
          fi

          cat ci-status.json

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.json
          git diff --cached --quiet || git commit -m "ci: update status $(date -Iseconds)"
          git push origin gh-pages