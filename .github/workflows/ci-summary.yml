name: CI Summary

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build *"
    types:
      - completed

concurrency: ci-summary

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Generate CI status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          FAILED=""

          # Single API call: fetch all workflow runs, pick latest per workflow
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=completed" \
            | jq -r '
              .workflow_runs
              | map(select(.name | startswith("Build ")))
              | group_by(.workflow_id)
              | map(max_by(.run_number))
              | .[]
              | select(.conclusion == "failure")
              | (.name | sub("^Build "; "") | sub(" \\("; " ") | sub("\\)"; "") | gsub(" "; "-"))
            ' | while read -r short; do
              FAILED="$FAILED $short"
            done

          FAILED=$(echo "$FAILED" | xargs)

          if [ -z "$FAILED" ]; then
            echo '{"schemaVersion":1,"label":"CI","message":"passing","color":"success"}' > ci-status.json
          else
            echo "{\"schemaVersion\":1,\"label\":\"CI\",\"message\":\"$FAILED\",\"color\":\"critical\"}" > ci-status.json
          fi

          cat ci-status.json

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.json
          git diff --cached --quiet || git commit -m "ci: update status $(date -Iseconds)"
          git push origin gh-pages