name: CI Summary

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'  # hourly fallback
  workflow_dispatch:

concurrency: ci-summary

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Generate CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 只统计**当前 HEAD** 的运行，避免读到已被取代的旧失败。
          #
          # 为什么必须限定 head_sha：本 workflow 由 push 触发，会在同一轮
          # push 的构建**尚未完成**时启动。此时某些 workflow 的"最新已完成
          # 运行"仍是**上一轮 push 的失败运行**——于是徽章错误地翻成 failing，
          # 直到下一次 push 才恢复。实测徽章在 09-18 ~ 09-21 间反复
          # failing→passing 成对出现（间隔 1~2 分钟），根因即此竞态。
          #
          # 限定 head_sha 后：只看本轮 commit 的运行。若某 workflow 本轮
          # 尚未完成，它在本次统计中**不出现**（既不算通过也不算失败），
          # 由该 workflow 自己完成后触发的下一次 ci-summary 补上。
          HEAD_SHA="${GITHUB_SHA}"

          # 需鉴权：GITHUB_TOKEN 享 1000 次/小时（匿名仅 60），且必须带
          # `-f`/`--fail`——否则 403 限流会返回 JSON 错误体，jq 取不到
          # workflow_runs 而静默判为 0 个失败（假 passing）。
          RUNS=$(curl -sS --fail \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=completed&head_sha=$HEAD_SHA" \
            ) || { echo "::error::GitHub API 请求失败（限流或网络）—— 保留现有徽章，不写入错误状态"; exit 1; }

          # 两条腿都要统计：包构建（`Build *`）与仓库检查（`CI`）。
          #
          # 2026-10-21 之前只统计前者，于是 `nix flake check` 红着、徽章照样
          # passing——外部审计（Copilot CLI）拿真实运行对出来：同一 commit 下
          # 28 个包构建成功、主 `CI` 的 Check 步骤失败，而 `ci-status.json` 仍是
          # `passing`。**质量信号不可信比没有信号更坏**。
          #
          # 结论不能只看 `failure`：cancelled / timed_out / startup_failure /
          # action_required / stale 同样是「没通过」。只有 skipped 与 neutral
          # 表示「条件未触发」，不算红。
          #
          # 已知边界（有意）：本轮**尚未完成**的 workflow 不出现在这里
          # （查询带 `status=completed`），因此徽章会短暂显示 passing，由整点
          # 的 schedule 或下一次 push 修正。立即报 pending 会和 push 触发的构建
          # 先后顺序打架，制造噪声。
          FAILED=$(echo "$RUNS" | jq -r '
            [.workflow_runs[]? | select(type == "object")]
            | map(select((.name? == "CI") or (.name? | startswith("Build "))))
            | group_by(.workflow_id)
            | map(sort_by(.run_number) | .[-1] // empty)
            | map(select(
                (.conclusion? != "success")
                and (.conclusion? != "skipped")
                and (.conclusion? != "neutral")
              ))
            | map(.name | sub("^Build "; "") | sub(" \\("; " ") | sub("\\)"; "") | gsub(" "; "-"))
            | join(" ")
          ' 2>/dev/null || true)

          if [ -n "$FAILED" ]; then
            echo "非绿的 workflow：$FAILED"
          fi

          if [ -z "$FAILED" ] || [ "$FAILED" = "null" ] || [ "$FAILED" = "" ]; then
            echo '{"schemaVersion":1,"label":"CI","message":"passing","color":"success"}' > ci-status.json
          else
            echo "{\"schemaVersion\":1,\"label\":\"CI\",\"message\":\"failing\",\"color\":\"critical\"}" > ci-status.json
          fi

          cat ci-status.json

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.json
          if git diff --cached --quiet; then
            echo "No changes, skipping push"
          else
            git commit -m "ci: update status $(date -Iseconds)"
            git push origin gh-pages
          fi
