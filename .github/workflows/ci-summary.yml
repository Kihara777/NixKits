name: CI Summary

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'  # hourly fallback
  workflow_dispatch:

concurrency: ci-summary

permissions:
  contents: write
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Generate CI status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch all completed workflow runs, pick the latest per workflow
          RUNS=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=completed")

          # Find failed "Build *" workflows (latest run per workflow)
          FAILED=$(echo "$RUNS" | jq -r '
            .workflow_runs
            | map(select(.name | startswith("Build ") and .conclusion == "failure"))
            | group_by(.workflow_id)
            | map(sort_by(.run_number) | .[-1] // empty)
            | map(.name | sub("^Build "; "") | sub(" \\("; " ") | sub("\\)"; "") | gsub(" "; "-"))
            | join(" ")
          ')

          if [ -z "$FAILED" ] || [ "$FAILED" = "null" ]; then
            echo '{"schemaVersion":1,"label":"CI","message":"passing","color":"success"}' > ci-status.json
          else
            echo "{\"schemaVersion\":1,\"label\":\"CI\",\"message\":\"failing\",\"color\":\"critical\"}" > ci-status.json
          fi

          cat ci-status.json

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status.json
          if git diff --cached --quiet; then
            echo "No changes, skipping push"
          else
            git commit -m "ci: update status $(date -Iseconds)"
            git push origin gh-pages
          fi
