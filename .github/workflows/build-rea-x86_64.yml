name: Build rea (x86_64)
on: [push, pull_request]

# 最小权限：调用方只需读取仓库内容（Cachix 推送凭据经 secrets 传入，
# 与 GITHUB_TOKEN 的权限无关）。显式声明可避免继承仓库默认的读写权限。
permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/build-package.yml
    with:
      package: "rea"
      runs-on: "ubuntu-latest"
      riscv64-cross: false
      # 原生架构上直接跑产物（不经 qemu）：CLI 能起来、子命令表完整、
      # 一次真实的静态分析跑得出 JSON。脚本自带反证。
      smoke-test: true
    secrets: inherit
