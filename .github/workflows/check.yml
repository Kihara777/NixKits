name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: nix flake check --no-write-lock-file

  build:
    needs: check
    strategy:
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
        package:
          - codewhale
          - kitsfmt
          - mcp-searxng
          - ruyi
          - ruyi-beta
          - ruyi-alpha
          - obs-bilibili-stream
          - opencode-telegram
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build ${{ matrix.package }}
        run: nix build --print-build-logs --no-write-lock-file ".#${{ matrix.package }}"

  riscv64-cross:
    needs: check
    strategy:
      matrix:
        package:
          - codewhale
          - kitsfmt
          - mcp-searxng
          - opencode-telegram
          - ruyi
          - ruyi-beta
          - ruyi-alpha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cross-compile ${{ matrix.package }}
        run: |
          case "${{ matrix.package }}" in
            ruyi)       PKG=./packages/ruyi/ruyi.nix ;;
            ruyi-beta)  PKG=./packages/ruyi/ruyi-beta.nix ;;
            ruyi-alpha) PKG=./packages/ruyi/ruyi-alpha.nix ;;
            *)          PKG=./packages/${{ matrix.package }}.nix ;;
          esac
          nix build --no-link --print-build-logs --impure \
            --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage $PKG { }"
