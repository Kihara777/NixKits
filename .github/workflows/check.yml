name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: nix flake check --no-write-lock-file

  build:
    needs: check
    strategy:
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build packages
        run: |
          nix build --print-build-logs --no-write-lock-file ".#codewhale"
          nix build --print-build-logs --no-write-lock-file ".#kitsfmt"
          nix build --print-build-logs --no-write-lock-file ".#mcp-searxng"
          nix build --print-build-logs --no-write-lock-file ".#ruyi"
          nix build --print-build-logs --no-write-lock-file ".#obs-bilibili-stream"
          nix build --print-build-logs --no-write-lock-file ".#opencode-telegram"

  riscv64-cross:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            access-tokens = api.github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cross-compile for riscv64
        run: |
          nix build --no-link --print-build-logs --impure --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ./packages/codewhale.nix { }"
          nix build --no-link --print-build-logs --impure --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ./packages/kitsfmt.nix { }"
          nix build --no-link --print-build-logs --impure --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ./packages/mcp-searxng.nix { }"
          nix build --no-link --print-build-logs --impure --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ./packages/opencode-telegram.nix { }"
          nix build --no-link --print-build-logs --impure --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ./packages/ruyi/ruyi.nix { }"
