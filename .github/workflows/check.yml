name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: nix flake check --no-write-lock-file

  build:
    needs: check
    strategy:
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build packages
        run: |
          for pkg in codewhale kitsfmt mcp-searxng obs-bilibili-stream opencode-telegram ruyi; do
            nix build --print-build-logs ".#$pkg" --no-write-lock-file
          done

  riscv64-cross:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cross-compile for riscv64
        run: |
          for pkg in codewhale kitsfmt mcp-searxng obs-bilibili-stream opencode-telegram ruyi; do
            nix build --no-link --print-build-logs --impure --expr "
              let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux;
              in pkgsHost.pkgsCross.riscv64.callPackage ./packages/\$pkg.nix { }
            "
          done
