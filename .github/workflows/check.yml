name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            # `access-tokens` 覆盖的是 **`github:` 取源**（flake 输入的 nixpkgs /
            # flake-utils，以及 riscv64 交叉路径里的 `builtins.getFlake
            # github:NixOS/nixpkgs`）——那些请求会带认证头。
            # 2026-10-21 起本仓不再有 URL 输入（llama-cpp-rocm 与它的浮动版本已迁到
            # `impure` 分支），所以这里只需列出 github.com，也不再需要
            # `--override-input` 那一套认证取回。
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: |
          set -euo pipefail
          # 用仓库里**已提交**的 flake.lock：main 已无浮动输入，lock 就是受测基线。
          nix flake check
