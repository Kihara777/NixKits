name: Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      riscv64-cross:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }} api.github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build ${{ inputs.package }}
        if: ${{ !inputs.riscv64-cross }}
        run: nix build --print-build-logs --no-write-lock-file ".#${{ inputs.package }}"

      - name: Cross-compile ${{ inputs.package }} (riscv64)
        if: ${{ inputs.riscv64-cross }}
        run: |
          PKG=./packages/${{ inputs.package }}.nix
          case "${{ inputs.package }}" in
            ruyi)         PKG=./packages/ruyi/ruyi.nix ;;
            ruyi-beta)    PKG=./packages/ruyi/ruyi-beta.nix ;;
            ruyi-alpha)   PKG=./packages/ruyi/ruyi-alpha.nix ;;
            codewhale)    PKG=./packages/codewhale-src.nix ;;
          esac
          nix build --no-link --print-build-logs --impure \
            --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage $PKG { }"