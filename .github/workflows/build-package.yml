name: Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      riscv64-cross:
        required: false
        type: boolean
        default: false
      # 构建完**真的跑一下**产物（见 develop/qemu-smoke-tests/）。
      # 默认关：开启即要求同名的烟测脚本存在，缺了直接失败——不允许静默跳过。
      smoke-test:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            # `access-tokens` 覆盖的是 **`github:` 取源**（flake 输入 nixpkgs /
            # flake-utils，以及 riscv64 交叉路径里的 `builtins.getFlake
            # github:NixOS/nixpkgs`）——那些请求会带认证头。
            # ⚠️ 它**不覆盖**浮动输入 `llama-cpp-ver`：那是普通 URL 输入
            # （`https://api.github.com/.../releases/latest`），Nix 不会把
            # access-tokens / netrc 附到这类 fetch 上（2026-10-05 实测，见下）。
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }} api.github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nixkits
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # ── 浮动输入 `llama-cpp-ver`：改成**认证取回 + 本地覆盖** ─────────────────
      # 它是普通 URL 输入（api.github.com/.../releases/latest），而 Nix 的
      # `access-tokens` / `netrc-file` 都不会附加到这类 fetch 上——2026-10-05 实测：
      # 给 api.github.com 配一个**假 token**，再取一个从未取过的 api.github.com URL；
      # 若认证头真的送出去，GitHub 必然回 401 `Bad credentials`——实际 fetch 成功，
      # 且未认证额度从 60 掉到 59。
      # 于是每个 job 都打一次**未认证**请求，共享 runner IP 的 60 次/小时用尽即 403。
      # 本仓已实测红过两次（`Build ruyi-beta (x86_64)` 2026-10-02、
      # `Build kitsfmt (x86_64)` 2026-10-04），响应体都是
      # "API rate limit exceeded for <ip>"。
      #
      # 处置：先由 `gh api`（认证，5000 次/小时）取回**同一份** JSON，再用
      # `--override-input` 作为本地输入喂给 Nix。语义不变——版本仍来自上游最新
      # release（overlay 只读 `json.tag_name`，见 overlays/llama-cpp-rocm.nix），
      # 但不再依赖未认证额度。取回失败或缺 `tag_name` 时**显式失败**，不静默跳过。
      - name: Resolve the floating llama-cpp-ver input (authenticated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/llama-cpp-ver.json"
          gh api repos/ggml-org/llama.cpp/releases/latest > "$json"
          tag="$(jq -r '.tag_name // empty' "$json")"
          if [ -z "$tag" ]; then
            echo "::error::取回的 release JSON 里没有 tag_name——拒绝继续（不静默回落到旧版本）"
            exit 1
          fi
          echo "llama-cpp-ver = $tag（认证取回，作为本地输入覆盖）"
          echo "LLAMA_CPP_VER_OVERRIDE=--override-input llama-cpp-ver path:$json" >> "$GITHUB_ENV"

      # 包文件解析。riscv64 有时需要**另一个构建文件**（上游没有该架构的预编译时
      # 改为源码构建），这张表是唯一的出处——构建步骤与烟测步骤都读它的输出。
      - name: Resolve the package file
        id: pkg
        run: |
          set -euo pipefail
          pkg="./packages/${{ inputs.package }}.nix"
          case "${{ inputs.package }}" in
            ruyi)         pkg="./packages/ruyi/ruyi.nix" ;;
            ruyi-beta)    pkg="./packages/ruyi/ruyi-beta.nix" ;;
            ruyi-alpha)   pkg="./packages/ruyi/ruyi-alpha.nix" ;;
            codewhale)    pkg="./packages/codewhale-src.nix" ;;
          esac
          echo "file=$pkg" >> "$GITHUB_OUTPUT"
          echo "包文件：$pkg"

      - name: Build ${{ inputs.package }}
        id: build
        if: ${{ !inputs.riscv64-cross }}
        run: |
          set -euo pipefail
          # 覆盖参数必须非空：空值会让 nix **静默**退回未认证取回（403 的来源）——
          # 那是「看起来正常」的失败，所以这里显式要求它存在。
          : "${LLAMA_CPP_VER_OVERRIDE:?认证取回步骤没有导出覆盖参数——拒绝退回未认证路径}"
          out="$(nix build --print-build-logs --no-write-lock-file $LLAMA_CPP_VER_OVERRIDE --print-out-paths ".#${{ inputs.package }}")"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "产物：$out"

      - name: Cross-compile ${{ inputs.package }} (riscv64)
        id: build-cross
        if: ${{ inputs.riscv64-cross }}
        run: |
          set -euo pipefail
          out="$(nix build --no-link --print-build-logs --impure --print-out-paths \
            --expr "let pkgsHost = (builtins.getFlake \"github:NixOS/nixpkgs/nixos-unstable\").legacyPackages.x86_64-linux; in pkgsHost.pkgsCross.riscv64.callPackage ${{ steps.pkg.outputs.file }} { }")"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "产物：$out"

      # ── 烟测：判据是「产物真的能跑」，不是「构建成功」 ──────────────────────────
      # 为什么必须有这一步：本仓库已经吃过两次亏——一个 job 长期靠 Cachix 缓存
      # 「成功」（取的是上一个版本的产物，一行都没构建过），以及一个构建成功的
      # riscv64 产物**一启动就抛**（直接依赖的原生模块没有该架构的绑定）。
      # 判据与本地同一份脚本：develop/qemu-smoke-tests/<包名>.sh（那脚本自带反证）。
      - name: Smoke-test the built artifact
        if: ${{ inputs.smoke-test }}
        run: |
          set -euo pipefail
          script="develop/qemu-smoke-tests/${{ inputs.package }}.sh"
          if [ ! -f "$script" ]; then
            echo "::error::smoke-test 已开启，但 $script 不存在——不允许静默跳过（「测试缺失即失败」）"
            exit 1
          fi

          # 跨架构产物要 qemu-user + binfmt。Ubuntu 的 qemu-user-static 装上即
          # 自动注册处理器（binfmt-support）。
          if [ "${{ inputs.riscv64-cross }}" = "true" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static binfmt-support
            # 处理器没就位就必须失败：否则脚本会以「exec format error」失败，
            # 或者更糟——被当成偶发而重跑掉。
            if ! ls /proc/sys/fs/binfmt_misc/ | grep -qi riscv64; then
              echo "::error::riscv64 的 binfmt 处理器没注册，无法运行构建物——拒绝报成功"
              ls -la /proc/sys/fs/binfmt_misc/ || true
              exit 1
            fi
            echo "binfmt：$(ls /proc/sys/fs/binfmt_misc/ | grep -i riscv64 | tr '\n' ' ')"
          fi

          OUT="${{ steps.build.outputs.out }}${{ steps.build-cross.outputs.out }}"
          if [ -z "$OUT" ]; then
            echo "::error::拿不到构建产物路径"
            exit 1
          fi
          echo "烟测对象：$OUT"
          bash "$script" "$OUT"
